kind = "web"
previewPath = "/"
title = "NestPro — PG & Hostel OS"
version = "1.0.0"
id = "artifacts/nestpro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18999

[services.development]
run = "pnpm --filter @workspace/nestpro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nestpro", "run", "build" ]
publicDir = "artifacts/nestpro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18999"
BASE_PATH = "/"
